# fly.toml — példa konfiguráció a Tome sync-szerverhez.
# Saját deployhoz írd át az `app` nevet és a mount source-t a sajátodra.
# Lásd: https://fly.io/docs/reference/configuration/
#

app = 'tome'
primary_region = 'fra'

[build]
  dockerfile = 'Dockerfile'

[env]
  NODE_ENV = 'production'
  PORT = '5050'

[[mounts]]
  source = 'tome_data'
  destination = '/app/server/data'
  initial_size = '1GB'

[http_service]
  internal_port = 5050
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
